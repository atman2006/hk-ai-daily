name: 港股AI日报

on:
  schedule:
    # 北京时间 09:05 = UTC 01:05（早盘前版，工作日）
    - cron: "5 1 * * 1-5"
    # 北京时间 17:05 = UTC 09:05（收盘版，工作日）
    - cron: "5 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "close=收盘版 / early=早盘前版"
        type: choice
        options: [close, early]
        default: close
      dry_run:
        description: "只生成不推送"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hk-ai-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 财务缓存 7 天 TTL，避免每天重抓 24 家财报
      - name: Restore financial cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fin-cache-${{ github.run_id }}
          restore-keys: fin-cache-

      - name: Decide mode
        id: m
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "5 1 * * 1-5" ]; then MODE=early; else MODE=close; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式：$MODE"

      - name: Run pipeline
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          REPORT_URL_BASE: ${{ vars.REPORT_URL_BASE }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/run.py --mode "${{ steps.m.outputs.mode }}" --dry-run
          else
            python scripts/run.py --mode "${{ steps.m.outputs.mode }}"
          fi

      - name: Commit reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports .cache/fin_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 港股AI日报 $(TZ=Asia/Shanghai date +%Y-%m-%d) ${{ steps.m.outputs.mode }}"
            git push
          fi

      # 可选：把 reports/ 发布到 GitHub Pages，钉钉消息里的链接就能直接点开
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: reports

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        continue-on-error: true
