name: 港股AI日报

on:
  schedule:
    # 港股 16:20（= UTC 08:20，工作日）：收盘竞价 16:10 结束后取正式收盘价
    # 另加两个备援槽：GitHub 定时任务高峰期会延迟，谁先跑成谁推，
    # 靠 .cache/pushed.json 去重，保证每天仍然只推一条
    - cron: "20 8 * * 1-5"
    - cron: "50 8 * * 1-5"   # 16:50 备援
    - cron: "20 9 * * 1-5"   # 17:20 备援
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=按时间自动判定 / close=收盘版 / intraday=盘中快照 / early=早盘前"
        type: choice
        options: [auto, close, intraday, early]
        default: auto
      force:
        description: "今日已推送过也强制重发"
        type: boolean
        default: false
      dry_run:
        description: "只生成不推送"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hk-ai-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 财务缓存 7 天 TTL，避免每天重抓 24 家财报
      - name: Restore financial cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fin-cache-${{ github.run_id }}
          restore-keys: fin-cache-

      - name: Decide mode
        id: m
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=auto; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "港时：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M %A')"
          echo "本次模式：$MODE（auto 会按港时自动判定）"

      - name: Build report + chart
        env:
          REPORT_URL_BASE: ${{ vars.REPORT_URL_BASE }}
          IMG_URL_BASE: ${{ vars.IMG_URL_BASE }}
        run: python scripts/run.py --mode "${{ steps.m.outputs.mode }}" --phase build

      - name: Commit reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports .cache/fin_cache.json .cache/pushed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 港股AI日报 $(TZ=Asia/Shanghai date +%Y-%m-%d) ${{ steps.m.outputs.mode }}"
            git pull --rebase --autostash origin main
            git push
          fi

      # 报告/图表先提交上线，保证消息里的图片和链接可访问后再推送
      - name: Push to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          REPORT_URL_BASE: ${{ vars.REPORT_URL_BASE }}
          IMG_URL_BASE: ${{ vars.IMG_URL_BASE }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then EXTRA="--force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/run.py --phase push --dry-run $EXTRA
          else
            python scripts/run.py --phase push $EXTRA
          fi

      # 推送成功后把「今天已推过」写回仓库，后续备援槽/延迟槽就会自动跳过
      - name: Commit push state
        if: always()
        run: |
          git add .cache/pushed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "推送状态无变化"
            exit 0
          fi
          git commit -m "chore: 推送状态 $(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      # 可选：把 reports/ 发布到 GitHub Pages，钉钉消息里的链接就能直接点开
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: reports

      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4
        continue-on-error: true
